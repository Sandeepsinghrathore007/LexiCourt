<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Warm Gold Gradient for Scales, Nib & Star -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Page / Silver Gradient for Codex Pages -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Subtle Glassmorphic Highlight Rim -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- High Court Scale Beam & Weights -->
  <g filter="url(#softGlow)">
    <path d="M18 20 C25 18.2, 39 18.2, 46 20" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="32" cy="19.2" r="2.2" fill="url(#goldGrad)"/>

    <!-- Left Scale Pan & Suspension Strings -->
    <line x1="19" y1="20.5" x2="15.5" y2="28" stroke="url(#goldGrad)" stroke-width="1.3"/>
    <line x1="19" y1="20.5" x2="22.5" y2="28" stroke="url(#goldGrad)" stroke-width="1.3"/>
    <path d="M14 28 C14 32.5, 24 32.5, 24 28 Z" fill="url(#goldGrad)"/>

    <!-- Right Scale Pan & Suspension Strings -->
    <line x1="45" y1="20.5" x2="41.5" y2="28" stroke="url(#goldGrad)" stroke-width="1.3"/>
    <line x1="45" y1="20.5" x2="48.5" y2="28" stroke="url(#goldGrad)" stroke-width="1.3"/>
    <path d="M40 28 C40 32.5, 50 32.5, 50 28 Z" fill="url(#goldGrad)"/>

    <!-- Central Golden Pen Nib / Pillar -->
    <path d="M32 20 L35.5 28 L32 40 L28.5 28 Z" fill="url(#goldGrad)"/>
    <line x1="32" y1="27" x2="32" y2="38" stroke="#1e1b4b" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="32" cy="28" r="0.8" fill="#1e1b4b"/>
  </g>

  <!-- Open Book Base (Language, Grammar & Vocabulary Study) -->
  <g filter="url(#softGlow)">
    <!-- Left Page -->
    <path d="M13 48 C19 45, 27 45.5, 31 48.5 L31 39 C27 36, 19 35.5, 13 38.5 Z" fill="url(#pageGrad)"/>
    <!-- Right Page -->
    <path d="M51 48 C45 45, 37 45.5, 33 48.5 L33 39 C37 36, 45 35.5, 51 39.5 Z" fill="url(#pageGrad)"/>
    <!-- Spine Center Lock -->
    <path d="M30 48.5 L32 50.5 L34 48.5 L32 39 Z" fill="#4338ca"/>
    <!-- Subtle Page Lines -->
    <path d="M16 42 C20 40, 25 40.5, 28 42.5" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
    <path d="M16 45 C20 43, 25 43.5, 28 45.5" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
    <path d="M36 42.5 C39 40.5, 44 40, 48 42" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
    <path d="M36 45.5 C39 43.5, 44 43, 48 45" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Golden 4-point Radiant Star at Crest -->
  <path d="M32 6 L33.4 9.5 L37 11 L33.4 12.5 L32 16 L30.6 12.5 L27 11 L30.6 9.5 Z" fill="url(#goldGrad)"/>
</svg>